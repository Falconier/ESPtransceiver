# Builds the station (espdr_trx_tk.py) as one executable for Linux and for Windows with PyInstaller, which can only build for the
# system it runs on. The executables are uploaded as workflow artifacts (Actions tab -> the run -> Artifacts).
name: build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # an older glibc, so the executable also runs on older distributions
            name: ESP-Station-linux-x86_64
          - os: windows-latest
            name: ESP-Station-windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk8.6 libportaudio2

      - name: Python packages, with the project's patch to espdr
        run: |
          python -m pip install --upgrade pip
          python -m pip install release/esp32_sdr_trx-1.0.0rc4-py3-none-any.whl pyinstaller
          ESPDR=$(python -c "import espdr, os; print(os.path.dirname(espdr.__file__))")
          patch -p4 -d "$ESPDR" < espdr-windows.patch

      - name: Build
        run: python packaging/build.py

      - name: Smoke test (esptool inside the executable, command line)
        run: |
          exe=dist/ESP-Station; [ "$RUNNER_OS" = Windows ] && exe=dist/ESP-Station.exe
          python -c "import subprocess, sys; r = subprocess.run([sys.argv[1], '-m', 'esptool', 'version'], capture_output=True, text=True, timeout=120); print(r.stdout); sys.exit(r.returncode)" "$exe"
          python -c "import subprocess, sys; r = subprocess.run([sys.argv[1], '--help'], capture_output=True, text=True, timeout=120); print(r.stdout[:300]); sys.exit(r.returncode)" "$exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
